[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "libattest-py"
version = "0.1.0"
description = "Python remote attestation helpers for the MockCA integration."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "pyasn1>=0.6.3",
    "pyasn1-alt-modules>=0.4.10",
    "requests>=2.28.0",
    "cryptography>=49.0.0, <50.0.0",
    "PyJWT>=2.13.0",  # ES256 compact JWS sign/verify (jose_jws); ECDSA via the cryptography dep above
    "pydantic>=2.9",  # EAR (EAT Attestation Result) token model (libattest.ear)
    "keyutils-py @ git+https://github.com/Guiliano99/keyutils-py.git",  # key generation helper (generate_key)
    "tpm2-pytss>=2.3.0",  # mandatory: ESAPI access + TPMS_ATTEST parsing
    "pyhpke @ git+https://github.com/dajiaji/pyhpke.git@7b80aefc90b258ffe763e5b164205c8c689b7f24",
    # Pinned to a commit on `main`, not the v3.2.0 tag/PyPI release (which
    # maps to commit 02b8a69f, Sep 2025). main is 22 commits ahead as of
    # this pin and includes COSE-HPKE Key Encryption mode algorithms
    # (HPKE-*-KE, e.g. COSEAlgs.HPKE_0_KE) plus PSK test vectors that
    # aren't in v3.2.0 yet.
    #   commit: 29730487f4c23e9a0e2181c78e7b6337228d4c59
    #   date:   2026-06-30
    #   subject: "Allow newer cryptography and add Python 3.14 tox (#670)"
    "cwt @ git+https://github.com/dajiaji/python-cwt.git@29730487f4c23e9a0e2181c78e7b6337228d4c59",

]

[project.optional-dependencies]
verifier-service = [
    "fastapi>=0.138.0",
    "uvicorn>=0.29.0",
]
testing = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",        # ASGI test client for FastAPI routes
]
dev = [
    "safety>=3.7.0,<4.0.0",
    "pylint>=4.0.4,<5.0.0",
    "ruff>=0.15.12,<1.0.0",
    "robotframework-robocop==8.2.11",
    "pyright[nodejs]==1.1.410",
    "codespell==2.4.2",
    "reuse==6.2.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["attest_client", "verifier_service"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["libattest*"]
