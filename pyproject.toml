[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "libattest-py"
version = "0.1.0"
description = "Python remote attestation helpers for the MockCA integration."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "pyasn1>=0.6.3",
    "pyasn1-alt-modules>=0.4.10",
    "requests>=2.28.0",
    "cryptography>=48.0.0, < 49.0.0",
    "keyutils_py @ git+https://github.com/Guiliano99/keyutils-py.git",
    #"cwt>=3.2.0",
]

[project.optional-dependencies]
verifier-service = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]
testing = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",        # ASGI test client for FastAPI routes
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["attest_client", "verifier_service"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["libattest*"]
